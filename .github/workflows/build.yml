name: Build app with Buildozer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

jobs:
  build:
    runs-on: ubuntu-22.04 # Usando uma versão estável e altamente compatível do Ubuntu

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Buildozer Cache
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build with Buildozer Action
      uses: kivy/buildozer-action@v1.2.4 # Versão oficial e atualizada do Kivy
      with:
        command: buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
