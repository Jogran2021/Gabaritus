name: Build app with Buildozer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Usando versão estável do Ubuntu para maior compatibilidade
    runs-on: ubuntu-22.04

    steps:
    # Puxa sempre a versão principal mais recente do checkout
    - name: Checkout code
      uses: actions/checkout@v4

    # O cache se adapta automaticamente baseado no arquivo do seu projeto
    - name: Get Buildozer Cache
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # ✅ CORRIGIDO: Usando a action que realmente funciona
    - name: Build with Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        command: buildozer android debug
        # Opcional: forçar versão específica do Buildozer
        # buildozer_version: stable

    # Envia o APK gerado usando a versão mais recente da ferramenta de upload
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk

    # Cria a liberação de download na última versão disponível da ferramenta
    - name: Create Automatic Release
      uses: marooned/automatic-releases@latest
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        automatic_release_tag: "latest"
        prerelease: false
        title: "Gabaritus - Última Versão Compilada"
        files: |
          bin/*.apk
