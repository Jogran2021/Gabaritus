name: Compilar Aplicativo Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    name: Build com Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgomp1
          pip install --upgrade pip
          pip install --upgrade "buildozer>=1.5.0" cython virtualenv

      - name: Compilar com Buildozer usando SDK do Sistema
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Baixar o arquivo gerado (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Gabaritus-APK
          path: bin/*.apk
