name: Build APK via Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Executa o processo dentro do container isolado oficial do Kivy
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Buildozer packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-docker-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-docker-

    - name: Build APK inside Container
      run: |
        # Sincroniza as diretivas de API do Android com o ecossistema estável interno do Docker
        sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
        sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25b/' buildozer.spec
        
        # Correção do EOFError: O comando 'warn_on_root=0' desarma a pergunta do terminal,
        # permitindo que o build rode em modo root de forma 100% automatizada.
        buildozer warn_on_root=0 android debug
      timeout-minutes: 60

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gabaritus-app
        path: bin/*.apk
