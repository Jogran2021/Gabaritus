name: Build APK via Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Executa todo o processo dentro do container oficial e isolado do Buildozer
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Buildozer packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-docker-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-docker-

    - name: Build APK inside Container
      run: |
        # Garante o alinhamento das ferramentas com o ecossistema interno estável do Docker
        sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
        sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25b/' buildozer.spec
        
        # O container já tem as dependências de sistema e o Cython configurados. 
        # Executa direto o empacotamento.
        buildozer android debug
      timeout-minutes: 60

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gabaritus-app
        path: bin/*.apk
