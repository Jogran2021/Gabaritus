name: Build APK Otimizado

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip \
          openjdk-17-jdk \
          autoconf libtool \
          pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake \
          libffi-dev libssl-dev \
          wget

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer>=1.5.0" cython

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Pre-Download Completo da Infraestrutura
      run: |
        # 1. Configura as propriedades direto no arquivo buildozer.spec antes de começar
        sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
        sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25b/' buildozer.spec
        
        # CORREÇÃO CIRÚRGICA: Ajusta os requerimentos para usar versões compatíveis com o Android
        sed -i 's/kivymd==2.1.0/kivymd==1.2.0/' buildozer.spec
        
        # 2. Força o Java 17 global
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        
        # Cria a base da estrutura de pastas do Buildozer
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        
        # ----------------------------------------------------
        # BLOCO A: Baixar e estruturar o Android SDK e as Build-Tools (Aidl)
        # ----------------------------------------------------
        mkdir -p android-sdk/cmdline-tools
        mkdir -p android-sdk/tools/bin
        cd android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip && rm commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest && mkdir cmdline-tools && mv latest cmdline-tools/
        
        ln -s /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        yes | ./cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=/home/runner/.buildozer/android/platform/android-sdk
        ./cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platform-tools" "platforms;android-33"
        
        # ----------------------------------------------------
        # BLOCO B: Baixar e estruturar o Android NDK (r25b) manualmente
        # ----------------------------------------------------
        cd /home/runner/.buildozer/android/platform
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip && rm android-ndk-r25b-linux.zip
        
        # ----------------------------------------------------
        # BLOCO C: Baixar e estruturar o Apache Ant manualmente
        # ----------------------------------------------------
        wget -q https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.tar.gz
        tar -xzf apache-ant-1.9.4-bin.tar.gz && rm apache-ant-1.9.4-bin.tar.gz
        
        # ----------------------------------------------------
        # DISPARO DO BUILD
        # ----------------------------------------------------
        cd /home/runner/work/Gabaritus/Gabaritus
        
        export BUILDOZER_WARN_ON_ROOT=0
        export APP_ANDROID_SDK=33
        unset ANDROID_HOME
        unset ANDROID_SDK_ROOT
        unset ANDROID_NDK_HOME
        
        buildozer android debug
      timeout-minutes: 60

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gabaritus-app
        path: bin/*.apk
