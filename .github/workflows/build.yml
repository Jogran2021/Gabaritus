name: Build APK Otimizado

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Versão altamente estável para receitas Kivy

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip \
          openjdk-17-jdk \
          autoconf libtool \
          pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake \
          libffi-dev libssl-dev \
          wget \
          expect # Instala o automatizador de respostas nativo do Linux

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer>=1.5.0" cython

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK com Resposta Automatica
      run: |
        # Configura as propriedades direto no arquivo buildozer.spec antes de compilar
        sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
        sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25b/' buildozer.spec
        
        # Garante que a pasta atual pertence ao usuário padrão 'runner'
        sudo chown -R runner:runner .
        
        # SCRIPT EXPECT: Ele inicia o buildozer e fica vigiando o terminal. 
        # Se o Buildozer perguntar do root, ele responde 'y'. Se não perguntar, segue normal.
        expect -c '
          set timeout -1
          spawn buildozer android debug
          expect {
            "Are you sure you want to continue" { send "y\r"; exp_continue }
            eof
          }
        '
      timeout-minutes: 60

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gabaritus-app
        path: bin/*.apk
