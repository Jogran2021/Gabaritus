name: Build app with Buildozer

on:
  push:
    branches: [ "main" ] # Altere para "master" se sua branch principal tiver esse nome
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite que você execute o build manualmente pelo GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Buildozer Cache
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build with Buildozer Action
      uses: artemsbulgakov/buildozeraction@v1
      with:
        command: buildozer android debug
        # Se você precisar aceitar licenças automaticamente, mantenha o True abaixo:
        buildozer_version: stable

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        # O Buildozer costuma salvar o APK gerado dentro da pasta 'bin'
        path: bin/*.apk
