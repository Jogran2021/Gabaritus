name: Build APK via Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Roda dentro do container oficial isolado do Buildozer
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Buildozer packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-docker-env-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-docker-env-

    - name: Build APK inside Container
      run: |
        # Sincroniza os parâmetros de API com as ferramentas internas estáveis do Docker
        sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
        sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25b/' buildozer.spec
        
        # Executa o build direto
        buildozer android debug
      timeout-minutes: 60
      env:
        # AQUI ESTÁ A ORDEM: Diz ao Buildozer para aceitar o modo root e nunca perguntar nada no terminal
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gabaritus-app
        path: bin/*.apk
