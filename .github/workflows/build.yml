name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip \
          openjdk-17-jdk \
          autoconf libtool \
          pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake \
          libffi-dev libssl-dev \
          wget

    - name: Install Android SDK (Build Tools)
      run: |
        # 1. Criar a estrutura correta de diretórios para o SDK moderno
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        cd ~/.buildozer/android/platform/android-sdk/cmdline-tools
        
        # 2. Baixar as ferramentas de linha de comando oficiais
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip
        rm commandlinetools-linux-11076708_latest.zip
        
        # 3. Mover para a pasta exigida 'latest' e entrar nela
        mv cmdline-tools latest
        cd latest/bin
        
        # 4. Aceitar as licenças do SDK
        yes | ./sdkmanager --licenses
        
        # 5. Instalar as build-tools e platforms exigidas
        ./sdkmanager "build-tools;33.0.2" "platform-tools" "platforms;android-33"
        
        # 6. ENGENHARIA REVERSA PARA O BUILDOZER:
        # Criamos a pasta antiga 'tools/bin' que o Buildozer procura internamente
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        
        # Criamos links simbólicos mapeando o caminho antigo para os binários modernos instalados
        ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
        
        echo "Android SDK instalado e configurado para o Buildozer com sucesso!"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK
      run: buildozer android debug
      timeout-minutes: 60
      env:
        # Aponta o Buildozer de forma fixa para o SDK que configuramos acima
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gabaritus-app
        path: bin/*.apk
