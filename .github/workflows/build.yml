name: Build APK Otimizado

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Versão estável que salvou o build dos loops

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip \
          openjdk-17-jdk \
          autoconf libtool \
          pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake \
          libffi-dev libssl-dev \
          wget

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer>=1.5.0" cython

    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK com Licenças Aceitas
      run: |
        # 1. Ajusta o arquivo buildozer.spec antes de começar
        sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
        sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25b/' buildozer.spec
        
        # 2. RESOLVE O SDKMANAGER: Baixa as cmdline-tools oficiais da Google e injeta no caminho esperado
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        cd ~/.buildozer/android/platform/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        rm commandlinetools-linux-11076708_latest.zip
        
        # Faz o mapeamento linkando o executável moderno para a pasta antiga que o Buildozer exige
        ln -s /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 3. Aceita previamente todas as licenças usando os hashes oficiais
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n2c4333f1a3b179752d77a32d542d16110f214d2e\n85766853833b0c35e10309735c065aed45053a40\ne9ac305950a7f5c5146beb6c34124d477921d9c9\n2ab3fcd278ab212449050d01447a62de3e97022d\n27e65a504e25384663784bd3853c99c50c87e56a\nf314b3fc041f46485c6077ec47ffed6a12c178c5" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        
        # Volta para a pasta do projeto para rodar o build
        cd /home/runner/work/Gabaritus/Gabaritus
        
        # 4. Executa o buildozer desativando o aviso de root e aplicando as variáveis globais
        export BUILDOZER_WARN_ON_ROOT=0
        export APP_ANDROID_SDK=33
        
        buildozer android debug
      timeout-minutes: 60

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gabaritus-app
        path: bin/*.apk
